name: Build and Deploy MCP Server FastAPI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - 'chart/**'
      - '.github/workflows/deploy.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - 'chart/**'
      - '.github/workflows/deploy.yaml'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  AWS_REGION: us-east-2
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CLUSTER_NAME: my-small-cluster
  NAMESPACE: mcp-server

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials (withcare-mgmt)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: arn:aws:iam::216989110335:role/OrganizationAccountAccessRole
        role-session-name: github-actions-mcp-deploy
        role-duration-seconds: 3600
        role-skip-session-tagging: true

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ./app
        file: ./app/Dockerfile
        platforms: linux/amd64  # Single architecture for AWS EKS
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: development
    permissions:
      contents: read
      packages: read
      id-token: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials (withcare-mgmt)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: arn:aws:iam::216989110335:role/OrganizationAccountAccessRole
        role-session-name: github-actions-mcp-deploy
        role-duration-seconds: 3600
        role-skip-session-tagging: true

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to Development
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Debug: Show all available tags
        echo "All image tags from build:"
        echo "${{ needs.build.outputs.image_tag }}"
        
        # Extract tag from the built image - use the SHA-based tag for guaranteed uniqueness
        IMAGE_TAG=$(echo "${{ needs.build.outputs.image_tag }}" | grep -E "develop-[a-f0-9]{7}" | head -1)
        if [ -z "$IMAGE_TAG" ]; then
          IMAGE_TAG=$(echo "${{ needs.build.outputs.image_tag }}" | head -1)
        fi
        
        # Extract just the tag part after the colon
        TAG_ONLY=${IMAGE_TAG##*:}
        echo "Selected image tag: $IMAGE_TAG"
        echo "Using tag: $TAG_ONLY"
        
        helm upgrade --install mcp-server-dev ./chart \
          --namespace ${{ env.NAMESPACE }}-dev \
          --create-namespace \
          --values ./chart/values-dev.yaml \
          --set image.tag="$TAG_ONLY" \
          --set image.pullPolicy=Always \
          --wait \
          --timeout 10m

    - name: Verify deployment
      run: |
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=mcp-server \
          -n ${{ env.NAMESPACE }}-dev --timeout=300s
        kubectl get pods -n ${{ env.NAMESPACE }}-dev

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials (withcare-mgmt)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: arn:aws:iam::216989110335:role/OrganizationAccountAccessRole
        role-session-name: github-actions-mcp-deploy
        role-duration-seconds: 3600
        role-skip-session-tagging: true

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to Production
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Extract tag from the built image - use the SHA-based tag for guaranteed uniqueness
        IMAGE_TAG=$(echo "${{ needs.build.outputs.image_tag }}" | grep -E "main-[a-f0-9]{7}" | head -1)
        if [ -z "$IMAGE_TAG" ]; then
          IMAGE_TAG=$(echo "${{ needs.build.outputs.image_tag }}" | head -1)
        fi
        
        # Extract just the tag part after the colon
        TAG_ONLY=${IMAGE_TAG##*:}
        echo "Using image tag: $TAG_ONLY"
        
        helm upgrade --install mcp-server-prod ./chart \
          --namespace ${{ env.NAMESPACE }} \
          --create-namespace \
          --values ./chart/values.yaml \
          --set image.tag="$TAG_ONLY" \
          --set image.pullPolicy=Always \
          --wait \
          --timeout 10m

    - name: Verify deployment
      run: |
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=mcp-server \
          -n ${{ env.NAMESPACE }} --timeout=300s
        kubectl get pods -n ${{ env.NAMESPACE }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build.outputs.image_tag }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'